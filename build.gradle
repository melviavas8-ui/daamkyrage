plugins {
    id 'fabric-loom' version '1.10.5'
    id 'java'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'Daamky-refmap.json'
    }
    runs {
        client {
            programArgs '--username', 'Daamky'
            vmArg '-Dfile.encoding=UTF-8'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'org.json:json:20230618'
    implementation 'org.reflections:reflections:0.10.2'
    implementation 'org.javassist:javassist:3.29.2-GA'
    implementation 'io.netty:netty-codec-socks:4.1.101.Final'
    implementation 'io.netty:netty-handler-proxy:4.1.101.Final'
    implementation 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    implementation 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'

    compileOnly files('libs/baritone-1.21.4.jar')
    modLocalRuntime files('libs/baritone-1.21.4.jar')
    modLocalRuntime files('libs/nether-pathfinder-1.4.1.jar')
    compileOnly files('libs/mcef-fabric-2.1.6-1.21.4.jar')
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '10000', '-Xmaxwarns', '0']
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
